<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cogwell Solutions — Command Center</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2F8; --surface:#FFFFFF; --sunk:#E4EAF3; --ink:#101828; --soft:#5B6B85; --line:#D8E0EC;
  --brand:#1E4B8C; --brand-ink:#FFFFFF; --accent:#2F6FE0; --accent-ink:#FFFFFF; --brass:#B7791F; --brass-bg:#FBF0D9;
  --ok:#22703F; --ok-bg:#DDEEE3; --bad:#A63A2C; --bad-bg:#F5E0DC; --info:#2B5E8C; --info-bg:#DEE9F3;
  --side:#0B213F; --side-ink:#E6ECF7; --side-soft:#8FA3C4;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B1220; --surface:#111A2C; --sunk:#182541; --ink:#E8EDF7; --soft:#8FA0C0; --line:#22304C;
    --brand:#5B8DEF; --brand-ink:#0B1220; --accent:#6FA8FF; --accent-ink:#0B1220; --brass:#E8B54A; --brass-bg:#2E2412;
    --ok:#6FCB9F; --ok-bg:#12291F; --bad:#F0776A; --bad-bg:#2E1E1B; --info:#7EB3DE; --info-bg:#16273A;
    --side:#070E1B; --side-ink:#E6ECF7; --side-soft:#6E85AC;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1220; --surface:#111A2C; --sunk:#182541; --ink:#E8EDF7; --soft:#8FA0C0; --line:#22304C;
  --brand:#5B8DEF; --brand-ink:#0B1220; --accent:#6FA8FF; --accent-ink:#0B1220; --brass:#E8B54A; --brass-bg:#2E2412;
  --ok:#6FCB9F; --ok-bg:#12291F; --bad:#F0776A; --bad-bg:#2E1E1B; --info:#7EB3DE; --info-bg:#16273A;
  --side:#070E1B; --side-ink:#E6ECF7; --side-soft:#6E85AC;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.45 'Public Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
h1,h2,h3,.num{font-family:'Bricolage Grotesque','Public Sans',sans-serif}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
.side{background:var(--side);color:var(--side-ink);padding:22px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;align-self:start}
.brand{display:flex;align-items:center;padding:0 10px 22px}
.brand-logo{width:100%;max-width:150px;height:auto;filter:brightness(0) invert(1)}
.nav{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:transparent;color:var(--side-ink);padding:9px 10px 9px 12px;border-radius:6px;border-left:3px solid transparent;font-weight:500;transition:background .12s ease,border-color .12s ease}
.nav:hover{background:rgba(255,255,255,.06)}
.nav.on{background:rgba(255,255,255,.1);border-left-color:var(--accent)}
.nav.sub{color:var(--side-soft);font-size:13px}
.sep{height:1px;background:rgba(255,255,255,.1);margin:12px 6px}
.badge{background:var(--accent);color:var(--accent-ink);border-radius:9px;font-size:11px;font-weight:600;padding:1px 7px}
.badge.red{background:#E5776A;color:#2a0d09}
.main{min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:11px 24px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;box-shadow:0 1px 3px rgba(16,24,40,.03)}
.clock{display:flex;align-items:center;gap:6px;flex-wrap:wrap;color:var(--soft);font-size:12.5px}
.clock b{color:var(--ink);font-weight:600;margin-right:4px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:5px;padding:3px 9px;font-size:12px}
.chip:hover{border-color:var(--brand);color:var(--brand)}
.chip.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.view{padding:24px 24px 70px;max-width:1240px}
h1{font-size:26px;margin:0 0 2px;font-weight:700;letter-spacing:-.01em}
.lede{color:var(--soft);margin:0 0 22px;max-width:70ch}
h2{font-size:16px;margin:0;font-weight:700}
.btn{background:var(--brand);color:var(--brand-ink);border:0;border-radius:6px;padding:8px 14px;font-weight:600;font-size:13px;transition:filter .12s ease,transform .12s ease}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--brand);color:var(--brand)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.danger{background:var(--bad);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:18px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.ph{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:13px 18px;border-bottom:1px solid var(--line)}
.pb{padding:14px 18px}
.ph p{margin:2px 0 0;color:var(--soft);font-size:12.5px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.cols3{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;font-weight:600;color:var(--soft)}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:7px 9px}
textarea{resize:vertical;min-height:70px}
.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.row>.field{flex:1 1 150px}
.muted{color:var(--soft)}
.small{font-size:12.5px}
.empty{color:var(--soft);padding:16px 0;text-align:center}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:600;color:var(--soft);font-size:12px;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.tblwrap{overflow-x:auto}
.pill{display:inline-block;border-radius:10px;padding:1px 9px;font-size:12px;font-weight:600;background:var(--sunk);color:var(--soft);white-space:nowrap}
.pill.ok,.pill.confirmed,.pill.accepted,.pill.sent{background:var(--ok-bg);color:var(--ok)}
.pill.booked,.pill.info{background:var(--info-bg);color:var(--info)}
.pill.bad,.pill.no_show,.pill.cancelled,.pill.declined,.pill.blocked{background:var(--bad-bg);color:var(--bad)}
.pill.warn,.pill.held,.pill.urgent{background:var(--brass-bg);color:var(--brass)}
/* dashboard */
.today{padding:18px 20px 12px}
.today-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.today-top h2{font-size:22px}
.tl-hours{display:grid;grid-template-columns:110px 1fr;font-size:11.5px;color:var(--soft);margin-bottom:4px}
.tl-hours .scale{display:flex;justify-content:space-between}
.tl-row{display:grid;grid-template-columns:110px 1fr;align-items:center;margin-bottom:8px}
.tl-name{font-weight:600;font-size:13px}
.tl-track{position:relative;height:38px;border-radius:6px;background:repeating-linear-gradient(90deg,var(--sunk) 0,var(--sunk) calc(11.111% - 1px),var(--line) calc(11.111% - 1px),var(--line) 11.111%)}
.tl-job{position:absolute;top:4px;bottom:4px;border-radius:4px;padding:0 6px;display:flex;align-items:center;font-size:11.5px;font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;background:var(--info-bg);color:var(--info);border:1px solid var(--info)}
.tl-job.confirmed{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.tl-job.completed{background:var(--sunk);color:var(--soft);border-color:var(--line)}
.tl-job.no_show{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.tl-job.emergency{box-shadow:inset 3px 0 0 var(--brass)}
.tl-now{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--brass)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi{padding:2px 0 2px 14px;border-left:3px solid var(--brand)}
.kpi .num{font-size:28px;font-weight:700;line-height:1.1}
.kpi .l{color:var(--soft);font-size:12.5px}
.att{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.att:last-child{border-bottom:0}
.att .t{font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--brand);margin-right:10px}
.dot.hi{background:var(--bad)} .dot.mid{background:var(--brass)}
.mods{display:grid;grid-template-columns:repeat(5,1fr);gap:0;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden;margin-bottom:18px}
.mod{padding:14px 16px;border:0;border-right:1px solid var(--line);background:transparent;text-align:left;color:var(--ink)}
.mod:last-child{border-right:0}
.mod:hover{background:var(--sunk)}
.mod b{font:700 15px 'Bricolage Grotesque';display:block}
.mod span{color:var(--soft);font-size:12.5px;display:block;margin-top:3px}
/* messages */
.msgwrap{display:grid;grid-template-columns:250px 1fr;min-height:420px}
.threads{border-right:1px solid var(--line);max-height:560px;overflow:auto}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tab{flex:1;padding:9px;border:0;background:transparent;color:var(--soft);font-weight:600;border-bottom:2px solid transparent}
.tab.on{color:var(--brand);border-bottom-color:var(--brand)}
.th{padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.th:hover{background:var(--sunk)} .th.on{background:var(--sunk);box-shadow:inset 3px 0 0 var(--brand)}
.th .n{font-weight:600;display:flex;justify-content:space-between;gap:6px}
.th .p{color:var(--soft);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.convo{display:flex;flex-direction:column}
.bubbles{padding:14px 16px;display:flex;flex-direction:column;gap:9px;max-height:380px;overflow:auto;flex:1}
.b{max-width:78%;padding:8px 11px;border-radius:10px;background:var(--sunk);align-self:flex-start;font-size:13.5px}
.b.out{align-self:flex-end;background:var(--brand);color:var(--brand-ink)}
.b.held,.b.blocked{background:transparent;border:1px dashed var(--brass);color:var(--ink)}
.b.blocked{border-color:var(--bad)}
.b .meta{font-size:11.5px;opacity:.8;margin-top:3px}
.b .why{font-size:12px;margin-top:4px;font-weight:600}
.composer{border-top:1px solid var(--line);padding:12px 16px;background:var(--surface)}
.gate{font-size:12.5px;margin:6px 0 8px;padding:6px 9px;border-radius:5px;background:var(--ok-bg);color:var(--ok)}
.gate.hold{background:var(--brass-bg);color:var(--brass)} .gate.block{background:var(--bad-bg);color:var(--bad)}
.focus{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.fc{border-left:3px solid var(--brass);padding:2px 0 2px 12px}
.fc .num{font-size:20px;font-weight:700}
/* calendar */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.day{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 10px;text-align:left;color:var(--ink)}
.day:hover{border-color:var(--brand)}
.day.on{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.day.today b{color:var(--brass)}
.day.closed{opacity:.5}
.day b{display:block;font-size:13px}
.day .n{font:700 20px 'Bricolage Grotesque';margin-top:2px}
.bar{height:5px;border-radius:3px;background:var(--sunk);margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand)}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.appt{display:grid;grid-template-columns:110px 1fr auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.appt:last-child{border-bottom:0}
.appt .tm{font:700 15px 'Bricolage Grotesque'}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.slots{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
/* pipeline */
.board{display:grid;grid-template-columns:repeat(5,minmax(170px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.colm{background:var(--sunk);border-radius:8px;padding:10px;min-height:120px}
.colm h3{font-size:13.5px;margin:0 0 8px;display:flex;justify-content:space-between}
.lead{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:9px 10px;margin-bottom:8px}
.lead .nm{font-weight:600;display:flex;justify-content:space-between;gap:6px}
.lead select{margin-top:6px;padding:3px 6px;font-size:12px}
.seq{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.seq:last-child{border-bottom:0}
.toggle{display:flex;align-items:center;gap:8px;font-size:13px}
.toggle input{width:auto}
/* chat widget */
.chatbox{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--bg)}
.chathead{background:var(--brand);color:var(--brand-ink);padding:10px 14px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.chatlog{padding:12px;display:flex;flex-direction:column;gap:8px;height:300px;overflow:auto}
.chatchips{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 10px}
.chatin{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);background:var(--surface)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:7px;font-weight:600;z-index:20;max-width:90vw}
.li{display:grid;grid-template-columns:1fr 70px 100px 100px 28px;gap:8px;margin-bottom:6px;align-items:center}
.xbtn{border:0;background:transparent;color:var(--soft);font-size:16px}
.totals{text-align:right;margin-top:10px}
.totals .g{font:700 20px 'Bricolage Grotesque'}
.consent{display:flex;gap:4px}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:10px;gap:4px}
  .brand,.sep{display:none}
  .nav{white-space:nowrap;width:auto;border-left:0;border-bottom:3px solid transparent}
  .nav.on{border-bottom-color:var(--accent)}
  .cols,.cols3,.msgwrap,.focus{grid-template-columns:1fr}
  .kpis,.stats{grid-template-columns:repeat(2,1fr)}
  .mods{grid-template-columns:1fr 1fr}
  .mod{border-bottom:1px solid var(--line)}
  .week{grid-template-columns:repeat(7,minmax(84px,1fr));overflow-x:auto}
  .threads{border-right:0;border-bottom:1px solid var(--line);max-height:220px}
  .view{padding:18px 14px 70px}.top{padding:10px 14px}
  .tl-hours,.tl-row{grid-template-columns:70px 1fr}
  .appt{grid-template-columns:1fr}.acts{justify-content:flex-start}
  .li{grid-template-columns:1fr 56px 84px 0 24px}.li input:nth-child(4){display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="shell">
  <nav class="side" aria-label="Sections">
    <div class="brand">
      <img src="cogwell_logo_full.png" alt="Cogwell" class="brand-logo">
    </div>
    <button class="nav" data-tab="dashboard" onclick="setTab('dashboard')">Dashboard</button>
    <button class="nav" data-tab="quoting" onclick="setTab('quoting')">Quoting <span class="badge" id="bQuote" hidden></span></button>
    <button class="nav" data-tab="messages" onclick="setTab('messages')">Messages <span class="badge" id="bMsg" hidden></span></button>
    <button class="nav" data-tab="calendar" onclick="setTab('calendar')">Calendar</button>
    <button class="nav" data-tab="pipeline" onclick="setTab('pipeline')">Pipeline <span class="badge" id="bPipe" hidden></span></button>
    <div class="sep"></div>
    <button class="nav sub" data-tab="system" onclick="setTab('system')">Settings and rules</button>
  </nav>
  <div class="main">
    <div class="top">
      <div class="clock"><b id="nowLabel"></b> <span id="clockModeLabel">simulated time</span>
        <span id="advanceControls">
        <button class="chip" onclick="advance(2,'h')">+2h</button>
        <button class="chip" onclick="advance(12,'h')">+12h</button>
        <button class="chip" onclick="advance(1,'d')">+1 day</button>
        <button class="chip" onclick="advance(3,'d')">+3 days</button>
        </span>
      </div>
      <div class="clock"><span id="orgLabel"></span> <button class="chip" onclick="logout()">Log out</button> <span id="saveNote"></span></div>
    </div>
    <div class="view" id="view"></div>
    <datalist id="custList"></datalist>

    <!-- ===== AI Insights widget: available on every screen ===== -->
    <button id="aiToggle" onclick="toggleAI()" style="position:fixed;bottom:20px;right:20px;width:52px;height:52px;border-radius:50%;background:var(--brand);color:var(--brand-ink);border:0;font-size:20px;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer;z-index:20">✦</button>
    <div id="aiPanel" style="display:none;position:fixed;bottom:82px;right:20px;width:320px;max-width:calc(100vw - 32px);max-height:60vh;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.3);z-index:20;flex-direction:column;overflow:hidden">
      <div style="padding:10px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center">
        <b style="font-size:13px">AI Rep — <span id="aiScreenLabel">Dashboard</span></b>
        <button class="chip" onclick="toggleAI()">Close</button>
      </div>
      <div id="aiLog" style="flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:8px;font-size:13px"></div>
      <div style="padding:8px;border-top:1px solid var(--line);display:flex;gap:6px">
        <input id="aiInput" placeholder="Ask about this screen…" style="flex:1;font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--ink)" onkeydown="if(event.key==='Enter'){askAI(this.value); this.value='';}">
        <button class="btn sm" onclick="askAI(document.getElementById('aiInput').value); document.getElementById('aiInput').value=''">Ask</button>
      </div>
    </div>
  </div>
</div>

<script>
/* ============ CONSTANTS ============ */
const KEY = 'cogwell-v3';
const TYPES = {
  repair:{label:'Repair',dur:45,tpl:[{desc:'Diagnostic call-out',qty:1,price:450},{desc:'Parts (est.)',qty:1,price:600},{desc:'Labour (1 hr)',qty:1,price:550}]},
  install:{label:'Install',dur:120,tpl:[{desc:'Equipment / unit',qty:1,price:8500},{desc:'Installation labour (3 hr)',qty:3,price:550},{desc:'Disposal',qty:1,price:350}]},
  maintenance:{label:'Maintenance',dur:60,tpl:[{desc:'Service visit',qty:1,price:400},{desc:'Filters / consumables',qty:1,price:250},{desc:'Labour (1 hr)',qty:1,price:550}]},
  emergency:{label:'Emergency',dur:60,tpl:[{desc:'After-hours call-out',qty:1,price:750},{desc:'Labour (1 hr)',qty:1,price:650},{desc:'Priority fee',qty:1,price:300}]}
};
const STAGES = [['new','New'],['contacted','Contacted'],['quoted','Quoted'],['booked','Booked'],['completed','Done']];
const STAGE_W = {new:.35,contacted:.45,quoted:.65,booked:.9};
const TRANSITIONS = {booked:['confirmed','completed','no_show','cancelled'],confirmed:['completed','no_show','cancelled'],completed:[],no_show:[],cancelled:[]};
const CH = {SMS:'sms',WhatsApp:'whatsapp',Email:'email'};
const URGENT = ['leak','no heat','no power','emergency','urgent','flood','burst','sparking','asap','fire','smoke','gas smell','not working'];
const REMINDERS = [48*60,24*60,2*60];
const FOLLOWUPS = [1,3,7];
const NURTURE = [1,3,7];
const SEQS = [
  {id:'reminder',name:'Appointment reminders',rule:'48h, 24h and 2h before a booked job. Sent as transactional messages.'},
  {id:'quote',name:'Quote follow-up',rule:'Day 1, 3 and 7 after a quote is sent. Stops when the quote is accepted or declined.'},
  {id:'nurture',name:'New lead nurture',rule:'Day 1, 3 and 7 for leads still New or Contacted. Stops once quoted or booked.'},
  {id:'rebook',name:'Rebooking nudge',rule:'When a customer passes their usual service interval. Marketing, so it needs explicit opt-in.'}
];

/* ============ UTIL ============ */
const pad = n => String(n).padStart(2,'0');
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() :
  'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c==='x'?r:(r&0x3|0x8)).toString(16);}));

const dISO = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const isoDate = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
const fmtMin = m => pad(Math.floor(m/60))+':'+pad(m%60);
const dayLabel = s => isoDate(s).toLocaleDateString('en-ZA',{weekday:'short',day:'numeric',month:'short'});
const fmtDT = iso => { if(!iso) return '—'; const d=new Date(iso); return d.toLocaleDateString('en-ZA',{weekday:'short',day:'numeric',month:'short'})+', '+pad(d.getHours())+':'+pad(d.getMinutes()); };
const money = n => 'R'+Math.round(n).toLocaleString('en-ZA');

const isUrgent = t => { const l=(t||'').toLowerCase(); return URGENT.some(k=>l.includes(k)); };
function guessType(t){ const l=(t||'').toLowerCase(); if(isUrgent(l)) return 'emergency'; if(/install|replace|new unit|new geyser|upgrade/.test(l)) return 'install'; if(/service|maintenance|annual|check/.test(l)) return 'maintenance'; return 'repair'; }
function ago(iso){ const h=(now()-new Date(iso))/36e5; if(h<1) return Math.max(1,Math.round(h*60))+' min'; if(h<48) return Math.round(h)+' h'; return Math.round(h/24)+' days'; }

/* ============ COMPLIANCE GATE (every outbound message passes here) ============ */
function inQuiet(d){ const m=d.getHours()*60+d.getMinutes(); const {quietStart:s,quietEnd:e}=state.biz; return s>e ? (m>=s||m<e) : (m>=s&&m<e); }
function nextQuietEnd(d){ const t=new Date(d); const e=state.biz.quietEnd; t.setHours(Math.floor(e/60),e%60,0,0); if(t<=d) t.setDate(t.getDate()+1); return t; }
/* kind: reply (answering an inbound), transactional (bookings, reminders, quotes), marketing (rebooking etc.) */
function gate(custId,channel,kind){
  const c=cust(custId); if(!c) return {action:'block',reason:'Unknown recipient'};
  const k=CH[channel];
  if(c.consent[k]==='out') return {action:'block',reason:first(c.name)+' opted out of '+channel};
  if(channel==='Email' && !c.email) return {action:'block',reason:'No email address on file'};
  if(channel!=='Email' && !c.phone) return {action:'block',reason:'No phone number on file'};
  if(kind==='marketing' && c.consent[k]!=='in') return {action:'block',reason:'No '+channel+' opt-in. Marketing needs explicit consent.'};
  let template=false;
  if(channel==='WhatsApp'){ const li=c.lastInbound?.WhatsApp; if(!(li && (now()-new Date(li))<864e5)) template=true; }
  const note = template ? 'Outside the 24h WhatsApp window, so an approved template is sent instead of free text.' : '';
  if(kind!=='reply' && inQuiet(now())) return {action:'hold',reason:'Quiet hours. Held until '+fmtMin(state.biz.quietEnd)+'.',sendAt:nextQuietEnd(now()).toISOString(),template};
  return {action:'send',reason:note,template};
}
function sendOut({custId,channel,kind,body,subject,tag}){
  const g=gate(custId,channel,kind);
  const m={id:uid('m'),thread:'customer',customerId:custId,dir:'out',channel,subject:subject||'',body,at:state.simNow,status:g.action==='send'?'sent':g.action==='hold'?'held':'blocked',reason:g.reason||'',template:!!g.template,sendAt:g.sendAt||null,kind,tag:tag||'',read:true};
  state.messages.push(m);
  const nm=custName(custId);
  if(g.action==='send'){ emit('MessageSent',channel+' to '+nm+(tag?' ('+tag+')':'')); const l=openLead(custId); if(l){ l.lastTouch=state.simNow; if(l.stage==='new') l.stage='contacted'; } }
  else if(g.action==='hold') emit('MessageHeld',channel+' to '+nm+' held: '+g.reason);
  else emit('MessageBlocked',channel+' to '+nm+' blocked: '+g.reason);
  return {...g,msg:m};
}
function releaseHeld(){
  state.messages.filter(m=>m.status==='held' && m.sendAt && new Date(m.sendAt)<=now()).forEach(m=>{
    const g=gate(m.customerId,m.channel,'reply'); // quiet hours have ended, consent is re-checked
    if(g.action==='block'){ m.status='blocked'; m.reason=g.reason; emit('MessageBlocked','Held '+m.channel+' to '+custName(m.customerId)+' blocked on release: '+g.reason); }
    else { m.status='sent'; m.sentAt=state.simNow; m.reason=''; emit('MessageSent','Held '+m.channel+' to '+custName(m.customerId)+' released'); }
  });
}
function receive(custId,channel,body){
  const c=cust(custId); if(!c) return;
  c.lastInbound=c.lastInbound||{}; c.lastInbound[channel]=state.simNow;
  state.messages.push({id:uid('m'),thread:'customer',customerId:custId,dir:'in',channel,subject:'',body,at:state.simNow,status:'received',read:false});
  if(/\bstop\b/i.test(body)){ c.consent={sms:'out',whatsapp:'out',email:'out'}; emit('OptOut',c.name+' replied STOP. Opted out of all channels.'); return; }
  if(/\b(yes|confirm|confirmed)\b/i.test(body)){
    const j=state.jobs.find(j=>j.customerId===custId && j.status==='booked' && j.date>=todayISO());
    if(j){ transition(j.id,'confirmed',true); sendOut({custId,channel,kind:'reply',body:'Thanks. Your '+TYPES[j.type].label.toLowerCase()+' on '+dayLabel(j.date)+' at '+fmtMin(j.startMin)+' is confirmed.',tag:'confirmation'}); return; }
    const l=openLead(custId);
    if(l?.offer && state.settings.botReply){ const o=l.offer; l.offer=null; const job=createJob({custId,techId:o.techId,date:o.date,startMin:o.startMin,type:l.type||'repair',dist:10,source:'bot'}); if(job) return; }
  }
  handleInboundLead(custId,channel,body);
}
function handleInboundLead(custId,channel,body){
  let l=openLead(custId);
  if(!l) l=createLead({custId,source:channel,note:body,urgent:isUrgent(body),type:guessType(body)});
  else { if(isUrgent(body)) l.urgent=true; }
  if(/\bquote\b/i.test(body)) l.quoteRequested=true;
  if(!state.settings.botReply || upcomingFor(custId)) return;
  const first_=first(custName(custId));
  const slots=findSlots(l.type||'repair',10,{urgent:l.urgent});
  if(state.settings.autoBook && slots[0]){
    const s=slots[0]; createJob({custId,techId:s.techId,date:s.date,startMin:s.startMin,type:l.type||'repair',dist:10,source:'bot'});
    sendOut({custId,channel,kind:'reply',body:'Thanks '+first_+'. I have booked you for '+dayLabel(s.date)+' at '+fmtMin(s.startMin)+'. Reply here if you need to change it.',tag:'bot booking'});
  } else if(slots[0]){
    l.offer=slots[0];
    sendOut({custId,channel,kind:'reply',body:'Thanks '+first_+', we got your message. The earliest opening is '+dayLabel(slots[0].date)+' at '+fmtMin(slots[0].startMin)+'. Reply YES and I will book it.',tag:'bot reply'});
  } else sendOut({custId,channel,kind:'reply',body:'Thanks '+first_+', we got your message. Someone from the team will be in touch shortly.',tag:'bot reply'});
}

const openLead = custId => state.leads.filter(l=>l.customerId===custId && !['completed','lost'].includes(l.stage)).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt))[0];
function createLead({custId,source,note,urgent,type}){
  const l={id:uid('l'),customerId:custId,source,stage:'new',note:note||'',urgent:!!urgent,type:type||'repair',createdAt:state.simNow,lastTouch:null,offer:null,quoteRequested:false,nurtured:[]};
  state.leads.push(l); emit('LeadCreated',custName(custId)+' from '+source+(urgent?' (urgent)':''),l.id); return l;
}
function moveLead(id,stage){
  const l=state.leads.find(l=>l.id===id); if(!l) return;
  if(stage==='lost'){
    const reasons=['Priced too high','Chose competitor','Timing','Ghosted','Other'];
    const pick=prompt('Why was this lead lost? ('+reasons.join(' / ')+')');
    if(!pick||!pick.trim()){ render(); return; } // cancelled — leave the stage unchanged
    l.lossReason=reasons.find(r=>r.toLowerCase()===pick.trim().toLowerCase())||pick.trim();
  } else { l.lossReason=null; }
  l.stage=stage; l.lastTouch=state.simNow; save(); render();
}
const upcomingFor = custId => state.jobs.find(j=>j.customerId===custId && ['booked','confirmed'].includes(j.status) && j.date>=todayISO());

/* ============ CALENDAR / JOB LIFECYCLE ============ */
const jobsFor=(techId,date,exclude)=>state.jobs.filter(j=>j.techId===techId&&j.date===date&&!['cancelled'].includes(j.status)&&j.id!==exclude).sort((a,b)=>a.startMin-b.startMin);
const driveMin=km=>Math.round(km/state.biz.speed*60);
function slotsFor(techId,date,type,dist,exclude){
  const d=isoDate(date); if(state.biz.closedDays.includes(d.getDay())) return [];
  const dur=TYPES[type].dur, drive=driveMin(dist), buf=state.biz.buffer+(type==='emergency'?15:0);
  const others=jobsFor(techId,date,exclude).map(j=>[j.startMin-(j.driveMin||0)-state.biz.buffer,j.startMin+j.durMin]);
  const out=[];
  for(let s=state.biz.workStart+drive;s+dur<=state.biz.workEnd;s+=15){
    if(date===todayISO() && s<nowMin()+30) continue;
    const a=s-drive-buf,b=s+dur;
    if(others.every(([x,y])=>b<=x||a>=y)) out.push(s);
  }
  return out;
}
function findSlots(type,dist,opts){
  const res=[]; const start=new Date(now()); start.setHours(0,0,0,0);
  for(let i=0;i<14&&res.length<12;i++){ const d=new Date(start); d.setDate(d.getDate()+i); const ds=dISO(d);
    techs().forEach(t=>slotsFor(t.id,ds,type,dist).slice(0,3).forEach(s=>res.push({techId:t.id,date:ds,startMin:s}))); }
  res.sort((a,b)=>a.date===b.date?a.startMin-b.startMin:a.date<b.date?-1:1);
  const seen=new Set(), out=[]; res.forEach(s=>{ const k=s.date+s.startMin; if(!seen.has(k)){ seen.add(k); out.push(s); } });
  return out.slice(0,6);
}
function createJob({custId,techId,date,startMin,type,dist,source,quoteId}){
  if(!slotsFor(techId,date,type,dist||10).includes(startMin)){ toast('That slot is no longer free.'); return null; }
  const j={id:uid('j'),customerId:custId,techId,date,startMin,durMin:TYPES[type].dur,type,dist:dist||10,driveMin:driveMin(dist||10),status:'booked',remindersSent:[],completedAt:null,quoteId:quoteId||null};
  state.jobs.push(j); emit('JobBooked',custName(custId)+', '+TYPES[type].label+' on '+dayLabel(date)+' at '+fmtMin(startMin)+(source?' ('+source+')':''),j.id);
  const l=openLead(custId); if(l){ l.stage='booked'; l.offer=null; }
  const c=cust(custId);
  sendOut({custId,channel:c.pref,kind:'transactional',subject:'Your booking with '+state.biz.name,body:'Hi '+first(c.name)+', you are booked for '+dayLabel(date)+' at '+fmtMin(startMin)+' with '+first(user(techId).name)+'. Reply YES to confirm.',tag:'booking confirmation'});
  return j;
}
function transition(id,to,silent){
  const j=state.jobs.find(j=>j.id===id); if(!j) return false;
  if(!TRANSITIONS[j.status].includes(to)){ toast('A '+j.status.replace('_',' ')+' job cannot become '+to.replace('_',' ')+'.'); return false; }
  const start=new Date(isoDate(j.date)); start.setMinutes(j.startMin);
  if((to==='completed'||to==='no_show') && start>now()){ toast('This job has not started yet. Advance the clock first.'); return false; }
  j.status=to;
  const c=cust(j.customerId);
  if(to==='completed'){ j.completedAt=state.simNow; emit('JobCompleted',c.name+', '+TYPES[j.type].label,j.id); const l=state.leads.find(l=>l.customerId===j.customerId&&l.stage==='booked'); if(l) l.stage='completed'; }
  if(to==='no_show') emit('JobNoShow',c.name+' did not show on '+dayLabel(j.date),j.id);
  if(to==='cancelled'){ emit('JobCancelled',c.name+', '+dayLabel(j.date)+' at '+fmtMin(j.startMin),j.id); sendOut({custId:j.customerId,channel:c.pref,kind:'transactional',subject:'Your booking was cancelled',body:'Hi '+first(c.name)+', your booking on '+dayLabel(j.date)+' at '+fmtMin(j.startMin)+' has been cancelled. Reply here to rebook.',tag:'cancellation'}); }
  if(to==='confirmed') emit('JobConfirmed',c.name+' confirmed '+dayLabel(j.date),j.id);
  save(); if(!silent) render(); return true;
}
function rescheduleJob(id,date,start){
  const j=state.jobs.find(j=>j.id===id); if(!j||!TRANSITIONS[j.status].length) return;
  if(!slotsFor(j.techId,date,j.type,j.dist,j.id).includes(start)){ toast('That slot is not free.'); return; }
  j.date=date; j.startMin=start; j.status='booked'; j.remindersSent=[]; resched=null;
  const c=cust(j.customerId);
  emit('JobRescheduled',c.name+' moved to '+dayLabel(date)+' at '+fmtMin(start),j.id);
  sendOut({custId:j.customerId,channel:c.pref,kind:'transactional',subject:'Your booking was moved',body:'Hi '+first(c.name)+', your booking is now '+dayLabel(date)+' at '+fmtMin(start)+'. Reply YES to confirm.',tag:'reschedule'});
  save(); render();
}

/* ============ SEQUENCES (Pipeline automation) ============ */
function enqueue(key,seq,custId,relatedId,body,subject,kind){
  if(state.queue.some(e=>e.key===key)) return;
  const e={id:uid('sq'),key,seq,customerId:custId,relatedId,body,subject:subject||'',kind,status:'pending',createdAt:state.simNow,outcome:null,reason:''};
  state.queue.push(e); if(state.settings.autoApprove) approveEntry(e.id,true);
}
function approveEntry(id,silent){
  const e=state.queue.find(e=>e.id===id); if(!e) return;
  const c=cust(e.customerId); if(!c){ e.status='done'; e.outcome='block'; e.reason='Customer removed'; return; }
  const r=sendOut({custId:e.customerId,channel:c.pref,kind:e.kind,body:e.body,subject:e.subject,tag:SEQS.find(s=>s.id===e.seq)?.name});
  e.status=r.action==='block'?'blocked':'done'; e.outcome=r.action; e.reason=r.reason; e.resolvedAt=state.simNow;
  if(r.action!=='block'){
    if(e.seq==='reminder'){ const j=state.jobs.find(j=>j.id===e.relatedId); if(j) j.remindersSent.push(Number(e.key.split(':')[2])); }
    if(e.seq==='quote'){ const q=state.quotes.find(q=>q.id===e.relatedId); if(q) q.followUps.push(state.simNow); }
    if(e.seq==='nurture'){ const l=state.leads.find(l=>l.id===e.relatedId); if(l) l.nurtured.push(state.simNow); }
    if(e.seq==='rebook') c.lastRebookAt=state.simNow;
  }
  if(!silent){ save(); render(); }
}
function retryEntry(id){ const e=state.queue.find(e=>e.id===id); if(e){ e.status='pending'; approveEntry(id); } }
function discardEntry(id){ state.queue=state.queue.filter(e=>e.id!==id); save(); render(); }
function approveAll(){ state.queue.filter(e=>e.status==='pending').forEach(e=>approveEntry(e.id,true)); save(); render(); }
function dormant(){
  return state.customers.map(c=>{
    const done=state.jobs.filter(j=>j.customerId===c.id&&j.status==='completed').sort((a,b)=>new Date(b.completedAt)-new Date(a.completedAt));
    if(!done.length||upcomingFor(c.id)) return null;
    const due=new Date(done[0].completedAt); due.setDate(due.getDate()+c.avgInterval);
    return due<now()?{c,last:done[0],due}:null;
  }).filter(Boolean);
}
function scan(){
  releaseHeld();
  const S=state.settings.seq;
  if(S.reminder) state.jobs.filter(j=>['booked','confirmed'].includes(j.status)).forEach(j=>{
    const st=new Date(isoDate(j.date)); st.setMinutes(j.startMin); if(st<=now()) return;
    const due=REMINDERS.filter(o=>now()>=new Date(st.getTime()-o*6e4)); if(!due.length) return;
    const o=Math.min(...due); const c=cust(j.customerId);
    REMINDERS.filter(x=>x>o&&!j.remindersSent.includes(x)).forEach(x=>j.remindersSent.push(x));
    enqueue('rem:'+j.id+':'+o,'reminder',j.customerId,j.id,'Reminder: your '+TYPES[j.type].label.toLowerCase()+' visit is '+dayLabel(j.date)+' at '+fmtMin(j.startMin)+' with '+first(user(j.techId).name)+'. Reply YES to confirm.','Appointment reminder','transactional');
  });
  if(S.quote) state.quotes.filter(q=>q.status==='sent').forEach(q=>{
    const days=(now()-new Date(q.sentAt))/864e5;
    if(days>=7){ q.status='expired'; emit('QuoteExpired',custName(q.customerId)+"'s "+TYPES[q.type].label.toLowerCase()+' quote expired after 7 days with no response',q.id); return; }
    const n=q.followUps.length; if(n>=FOLLOWUPS.length||days<FOLLOWUPS[n]) return;
    enqueue('qf:'+q.id+':'+n,'quote',q.customerId,q.id,'Hi '+first(custName(q.customerId))+', just checking in on your '+TYPES[q.type].label.toLowerCase()+' quote of '+quoteText(q)+'. Happy to answer any questions.','Following up on your quote','transactional');
  });
  if(S.nurture) state.leads.filter(l=>['new','contacted'].includes(l.stage)).forEach(l=>{
    const days=(now()-new Date(l.createdAt))/864e5; const n=l.nurtured.length; if(n>=NURTURE.length||days<NURTURE[n]) return;
    enqueue('nu:'+l.id+':'+n,'nurture',l.customerId,l.id,'Hi '+first(custName(l.customerId))+', following up on your enquiry. Would you like us to book a visit or send a quote?','Following up on your enquiry','transactional');
  });
  if(S.rebook) dormant().forEach(d=>{
    if(d.c.lastRebookAt && (now()-new Date(d.c.lastRebookAt))/864e5<90) return;
    enqueue('rb:'+d.c.id+':'+d.last.id,'rebook',d.c.id,d.c.id,'Hi '+first(d.c.name)+', it is about time for your next service. Want us to pencil you in?','Time for your next service','marketing');
  });
  save();
}

/* ============ AI REP INSIGHTS ============ */
function lastMsg(custId){ return state.messages.filter(m=>m.customerId===custId).sort((a,b)=>new Date(b.at)-new Date(a.at))[0]; }
function prospects(){
  return state.leads.filter(l=>!['completed','lost'].includes(l.stage)).map(l=>{
    const c=cust(l.customerId); const q=state.quotes.filter(q=>q.customerId===l.customerId&&q.status==='sent').sort((a,b)=>new Date(b.sentAt)-new Date(a.sentAt))[0];
    const value=q?quoteTotal(q):(TYPES[l.type||'repair'].tpl.reduce((s,i)=>s+i.qty*i.price,0)*(1+state.biz.vat));
    const lm=lastMsg(l.customerId); const waiting=lm&&lm.dir==='in'?(now()-new Date(lm.at))/36e5:0;
    let score=value*(STAGE_W[l.stage]||.3); const why=[money(value)+(q?' quoted':' estimated')];
    if(l.urgent){ score*=1.5; why.push('urgent'); }
    if(waiting>=1){ score*=1.3; why.push('waiting '+ago(lm.at)+' for a reply'); }
    let action='Make first contact'; 
    if(waiting>=1) action='Reply now';
    else if(q){ const d=Math.floor((now()-new Date(q.sentAt))/864e5); if(d>=2){ action='Follow up on the quote'; why.push('quote sent '+d+' days ago'); } else action='Wait for the quote reply'; }
    else if(l.stage==='booked') action='Confirm the appointment';
    else if(l.stage==='contacted') action='Offer a booking or quote';
    return {lead:l,c,value,score,why,action};
  }).sort((a,b)=>b.score-a.score);
}
const STAGE_DWELL = {new:1, contacted:3, quoted:5, booked:2};
function staleLeads(){ return state.leads.filter(l=>{ const d=STAGE_DWELL[l.stage]; if(!d) return false; const age=(now()-new Date(l.lastTouch||l.createdAt))/864e5; return age>=d; }); }
function important(){
  const out=[];
  prospects().forEach(p=>{ if(p.lead.urgent&&p.lead.stage!=='booked') out.push({sev:3,title:'Urgent: '+p.c.name,detail:p.why.join(', ')+'. '+p.action+'.',tab:'messages',thread:'c:'+p.c.id,cta:'Open thread'}); });
  overdueJobs().forEach(j=>out.push({sev:3,title:'No outcome logged: '+custName(j.customerId),detail:TYPES[j.type].label+' was due '+fmtMin(j.startMin)+' '+dayLabel(j.date)+'. Mark it completed, no-show or cancelled.',tab:'calendar',cta:'Open calendar'}));
  overdueCommitments().forEach(e=>out.push({sev:3,title:'Broken commitment: '+custName(e.customerId),detail:'"'+e.body+'" was due '+dayLabel(dISO(new Date(e.dueAt)))+' and is still open.',tab:'pipeline',cta:'Open queue'}));
  state.customers.forEach(c=>{ const lm=lastMsg(c.id); if(lm&&lm.dir==='in'&&(now()-new Date(lm.at))/36e5>=1 && !out.some(o=>o.thread==='c:'+c.id)) out.push({sev:2,title:c.name+' is waiting for a reply',detail:'Last message '+ago(lm.at)+' ago on '+lm.channel+'.',tab:'messages',thread:'c:'+c.id,cta:'Reply'}); });
  state.quotes.filter(q=>q.status==='sent'&&(now()-new Date(q.sentAt))/864e5>=2).forEach(q=>out.push({sev:2,title:'Quote unanswered: '+custName(q.customerId),detail:money(quoteTotal(q))+' sent '+ago(q.sentAt)+' ago, '+q.followUps.length+' follow-ups so far.',tab:'quoting',cta:'Manage quotes'}));
  staleLeads().forEach(l=>out.push({sev:2,title:'Stuck in '+STAGES.find(s=>s[0]===l.stage)[1]+': '+custName(l.customerId),detail:'No movement for '+Math.floor((now()-new Date(l.lastTouch||l.createdAt))/864e5)+' day(s), past the '+STAGE_DWELL[l.stage]+'-day mark for this stage.',tab:'pipeline',cta:'Open pipeline'}));
  const blocked=state.messages.filter(m=>m.status==='blocked'&&m.dir==='out'); if(blocked.length) out.push({sev:2,title:blocked.length+' message'+(blocked.length>1?'s':'')+' blocked',detail:'Latest: '+blocked[blocked.length-1].reason,tab:'messages',cta:'Review'});
  const pend=state.queue.filter(e=>e.status==='pending').length; if(pend) out.push({sev:1,title:pend+' automated message'+(pend>1?'s':'')+' waiting for approval',detail:'Approve them or switch on auto-approve.',tab:'pipeline',cta:'Open queue'});
  const tomorrow=dISO(new Date(now().getTime()+864e5)); state.jobs.filter(j=>j.status==='booked'&&j.date===tomorrow).forEach(j=>out.push({sev:1,title:'Unconfirmed tomorrow: '+custName(j.customerId),detail:TYPES[j.type].label+' at '+fmtMin(j.startMin)+'. The customer has not replied YES.',tab:'calendar',cta:'View day'}));
  dormant().forEach(d=>out.push({sev:0,title:'Overdue for service: '+d.c.name,detail:'Last job '+dayLabel(dISO(new Date(d.last.completedAt)))+'. Usually books every '+d.c.avgInterval+' days.',tab:'pipeline',cta:'See rebooking'}));
  return out.sort((a,b)=>b.sev-a.sev);
}

let TAB='dashboard', selDay=null, weekOff=0, activeThread=null, threadTab='customer', compose={to:'',channel:'SMS',subject:'',body:''}, simReply='', resched=null, bookPrefill='', bookRes=null, qFilter='all', chat=null;

function go(tab,thread){ if(thread){ activeThread=thread; threadTab=thread[0]==='u'?'staff':'customer'; compose.to=thread; } setTab(tab); }
function advance(n,u){ const d=now(); if(u==='h') d.setHours(d.getHours()+n); else d.setDate(d.getDate()+n); state.simNow=d.toISOString(); scan(); render(); }
function pill(s){ return '<span class="pill '+esc(s)+'">'+esc(String(s).replace('_',' '))+'</span>'; }
function timeline(date){
  const S=state.biz.workStart,E=state.biz.workEnd,span=E-S;
  const hrs=[]; for(let h=S/60;h<=E/60;h++) hrs.push('<span>'+pad(h)+'</span>');
  let h='<div class="tl-hours"><span></span><div class="scale">'+hrs.join('')+'</div></div>';
  techs().forEach(t=>{
    const jobs=state.jobs.filter(j=>j.techId===t.id&&j.date===date&&j.status!=='cancelled');
    h+='<div class="tl-row"><div class="tl-name">'+esc(first(t.name))+'</div><div class="tl-track">'+jobs.map(j=>'<div class="tl-job '+j.status+' '+(j.type==='emergency'?'emergency':'')+'" style="left:'+((j.startMin-S)/span*100)+'%;width:'+(j.durMin/span*100)+'%" title="'+esc(custName(j.customerId)+', '+TYPES[j.type].label+' '+fmtMin(j.startMin)+' to '+fmtMin(j.startMin+j.durMin))+'">'+esc(custName(j.customerId))+'</div>').join('')+(date===todayISO()&&nowMin()>=S&&nowMin()<=E?'<div class="tl-now" style="left:'+((nowMin()-S)/span*100)+'%"></div>':'')+'</div></div>';
  });
  return h;
}
function dayStats(date){
  const js=state.jobs.filter(j=>j.date===date&&j.status!=='cancelled');
  const cap=techs().length*(state.biz.workEnd-state.biz.workStart);
  const booked=js.reduce((s,j)=>s+j.durMin,0);
  const rev=js.filter(j=>j.status!=='no_show').reduce((s,j)=>s+TYPES[j.type].tpl.reduce((a,i)=>a+i.qty*i.price,0)*(1+state.biz.vat),0);
  return {jobs:js.length,hours:booked/60,util:cap?Math.round(booked/cap*100):0,rev,drive:js.reduce((s,j)=>s+(j.driveMin||0),0),noshow:js.filter(j=>j.status==='no_show').length,cancelled:state.jobs.filter(j=>j.date===date&&j.status==='cancelled').length};
}

/* ============ AI INSIGHTS WIDGET (Gemini, via Netlify Function) ============ */
let aiChat = [];
let aiOpen = false;
const SCREEN_NAMES = {dashboard:'Dashboard', calendar:'Calendar', quoting:'Quoting', pipeline:'Pipeline', messages:'Messages', system:'System'};

function countBy(arr, key){ const o={}; (arr||[]).forEach(x=>{ const k=x[key]; o[k]=(o[k]||0)+1; }); return o; }

function buildScreenContext(tab){
  try{
    switch(tab){
      case 'dashboard': {
        const t=todayISO();
        return {
          jobsToday: state.jobs.filter(j=>j.date===t).length,
          jobsUpcoming: state.jobs.filter(j=>j.date>=t && ['booked','confirmed'].includes(j.status)).length,
          leadsByStage: countBy(state.leads,'stage'),
          quotesByStatus: countBy(state.quotes,'status'),
          blockedMessages: state.messages.filter(m=>m.status==='blocked').length,
          pendingAutomationQueue: state.queue.filter(e=>e.status==='pending').length
        };
      }
      case 'calendar':
        return { totalJobs: state.jobs.length, byStatus: countBy(state.jobs,'status'),
          technicians: state.users.filter(u=>u.role==='technician').map(u=>u.name),
          selectedDay: selDay };
      case 'quoting':
        return { byStatus: countBy(state.quotes,'status'),
          totalOpenValue: state.quotes.filter(q=>q.status==='sent').reduce((s,q)=>s+(q.items||[]).reduce((a,i)=>a+(i.qty*i.price||0),0),0) };
      case 'pipeline':
        return { byStage: countBy(state.leads,'stage'), urgentLeads: state.leads.filter(l=>l.urgent).length };
      case 'messages':
        return { byStatus: countBy(state.messages,'status'), unread: state.messages.filter(m=>!m.read).length };
      case 'system':
        return { teamSize: state.users.length, businessHours: state.biz.workStart+'–'+state.biz.workEnd,
          quietHours: state.biz.quietStart+'–'+state.biz.quietEnd, autoApprove: !!state.settings.autoApprove,
          pendingInvites: pendingInvites.length };
      default:
        return {};
    }
  }catch(e){ return { note: 'Could not gather context for this screen.' }; }
}

function toggleAI(){
  aiOpen = !aiOpen;
  document.getElementById('aiPanel').style.display = aiOpen ? 'flex' : 'none';
  document.getElementById('aiScreenLabel').textContent = SCREEN_NAMES[TAB] || TAB;
  if(aiOpen && !aiChat.length){
    askAI('Give me insights on what you see on this screen.');
  }
}

function renderAiLog(){
  const el = document.getElementById('aiLog'); if(!el) return;
  el.innerHTML = aiChat.map(m=>`<div style="align-self:${m.from==='you'?'flex-end':'flex-start'};max-width:85%;padding:7px 10px;border-radius:8px;background:${m.from==='you'?'var(--brand)':'var(--sunk)'};color:${m.from==='you'?'var(--brand-ink)':'var(--ink)'}">${esc(m.text)}</div>`).join('');
  el.scrollTop = el.scrollHeight;
}

async function askAI(question){
  question = (question||'').trim();
  if(!question) return;
  if(!aiOpen){ aiOpen=true; document.getElementById('aiPanel').style.display='flex'; }
  document.getElementById('aiScreenLabel').textContent = SCREEN_NAMES[TAB] || TAB;
  aiChat.push({from:'you', text:question});
  aiChat.push({from:'bot', text:'Thinking…'});
  renderAiLog();
  try{
    const resp = await fetch('/.netlify/functions/ai-insights', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ message:question, screen: SCREEN_NAMES[TAB]||TAB, context: buildScreenContext(TAB) })
    });
    const data = await resp.json();
    aiChat.pop();
    aiChat.push({from:'bot', text: data.text || ('Error: '+(data.error||'no response'))});
  }catch(err){
    aiChat.pop();
    aiChat.push({from:'bot', text:'Could not reach the AI assistant. Is it deployed yet?'});
  }
  renderAiLog();
}

function ensureDraft(){ if(!draft.items) draft.items=TYPES[draft.type].tpl.map(x=>({...x})); }
function switchType(t){ draft.type=t; draft.items=TYPES[t].tpl.map(x=>({...x})); render(); }
function startFromLead(id){ const l=state.leads.find(l=>l.id===id); if(!l) return; draft={customer:custName(l.customerId),type:l.type||'repair',items:TYPES[l.type||'repair'].tpl.map(x=>({...x})),range:false,reviseOf:null,channel:''}; render(); window.scrollTo(0,0); }
function reviseQuote(id){ const q=state.quotes.find(q=>q.id===id); if(!q) return; draft={customer:custName(q.customerId),type:q.type,items:q.items.map(x=>({...x})),range:q.isRange,reviseOf:q.id,channel:''}; render(); window.scrollTo(0,0); }
function saveQuote(send){
  ensureDraft(); const name=(draft.customer||'').trim(); if(!name){ toast('Enter a customer name first.'); return; }
  const c=findOrCreate(name); const channel=draft.channel||c.pref;
  const prev=draft.reviseOf?state.quotes.find(q=>q.id===draft.reviseOf):null;
  const q={id:uid('q'),customerId:c.id,type:draft.type,items:draft.items.map(x=>({...x})),version:prev?prev.version+1:1,status:'draft',createdAt:state.simNow,sentAt:null,followUps:[],isRange:draft.range,leadId:openLead(c.id)?.id||null};
  if(send){
    const r=deliverQuote(q,channel);
    if(r.action==='block'){ toast('Not sent: '+r.reason); q.status='draft'; }
    else { q.status='sent'; q.sentAt=state.simNow; if(prev){ prev.status='superseded'; emit('QuoteRevised',c.name+' quote is now v'+q.version,q.id); } emit('QuoteSent',c.name+', '+quoteText(q),q.id); const l=openLead(c.id); if(l&&['new','contacted'].includes(l.stage)) l.stage='quoted'; toast(r.action==='hold'?'Quote held until '+fmtMin(state.biz.quietEnd)+'.':'Quote sent.'); }
  } else toast('Draft saved.');
  state.quotes.push(q); draft={customer:'',type:'repair',items:null,range:false,reviseOf:null,channel:''}; save(); render();
}
function sendDraftQuote(id){ const q=state.quotes.find(q=>q.id===id); const c=cust(q.customerId); const r=deliverQuote(q,c.pref); if(r.action==='block'){ toast('Not sent: '+r.reason); render(); return; } q.status='sent'; q.sentAt=state.simNow; const l=openLead(c.id); if(l&&['new','contacted'].includes(l.stage)) l.stage='quoted'; emit('QuoteSent',c.name+', '+quoteText(q),q.id); save(); render(); toast('Quote sent.'); }
function setQuote(id,status){ const q=state.quotes.find(q=>q.id===id); if(!q) return; q.status=status; if(status==='accepted') emit('QuoteAccepted',custName(q.customerId)+' accepted '+quoteText(q),q.id); if(status==='declined'){ const l=openLead(q.customerId); if(l){ l.stage='lost'; l.lossReason='Declined quote'; l.lastTouch=state.simNow; } } save(); render(); }
function bookFromQuote(id){ const q=state.quotes.find(q=>q.id===id); bookPrefill=custName(q.customerId); bookRes={type:q.type,quoteId:q.id}; setTab('calendar'); }

    <div class="row"><div class="field"><label for="qc">Customer</label><input id="qc" list="custList" value="${esc(draft.customer)}" oninput="draft.customer=this.value" onchange="render()" placeholder="Start typing a name"></div>
    <div class="field"><label for="qt">Template</label><select id="qt" onchange="switchType(this.value)">${Object.entries(TYPES).map(([k,v])=>`<option value="${k}" ${draft.type===k?'selected':''}>${v.label}</option>`).join('')}</select></div>
    <div class="field"><label for="qch">Send by</label><select id="qch" onchange="draft.channel=this.value;render()">${['Email','SMS','WhatsApp'].map(c=>`<option ${ch===c?'selected':''}>${c}</option>`).join('')}</select></div></div>
    <div style="margin-top:14px">${draft.items.map((li,i)=>`<div class="li"><input aria-label="Description" value="${esc(li.desc)}" onchange="draft.items[${i}].desc=this.value"><input aria-label="Quantity" type="number" min="0" value="${li.qty}" onchange="draft.items[${i}].qty=parseFloat(this.value)||0;render()"><input aria-label="Price" type="number" min="0" value="${li.price}" onchange="draft.items[${i}].price=parseFloat(this.value)||0;render()"><input aria-label="Line total" value="${money(li.qty*li.price)}" disabled><button class="xbtn" aria-label="Remove line" onclick="draft.items.splice(${i},1);render()">×</button></div>`).join('')}

/* ============ MESSAGES ============ */
function threadList(){
  if(threadTab==='staff') return state.users.map(u=>{ const ms=state.messages.filter(m=>m.thread==='staff'&&m.userId===u.id); const l=ms[ms.length-1]; return {key:'u:'+u.id,name:u.name,sub:u.role,preview:l?l.body:'No messages yet',unread:0,at:l?l.at:''}; });
  const ids=[...new Set(state.messages.filter(m=>m.thread==='customer').map(m=>m.customerId))];
  return ids.map(id=>{ const ms=state.messages.filter(m=>m.customerId===id&&m.thread==='customer'); const l=ms.sort((a,b)=>new Date(a.at)-new Date(b.at))[ms.length-1]; return {key:'c:'+id,name:custName(id),preview:l.body,unread:ms.filter(m=>m.dir==='in'&&!m.read).length,at:l.at}; }).sort((a,b)=>new Date(b.at)-new Date(a.at));
}
function openThread(key){ activeThread=key; compose.to=key; const [k,id]=key.split(':'); if(k==='c'){ state.messages.filter(m=>m.customerId===id&&m.dir==='in').forEach(m=>m.read=true); const c=cust(id); if(c) compose.channel=c.pref; } else compose.channel='Internal'; save(); render(); }
const MSG_TAGS=['Needs Reply','Waiting on Client','Commitment Made','FYI'];
function tagMessage(id,tag){
  const m=state.messages.find(m=>m.id===id); if(!m) return;
  if(tag==='Commitment Made'){
    const desc=prompt('What was promised?'); if(!desc||!desc.trim()){ return; }
    const due=prompt('Due date (YYYY-MM-DD)?', dISO(new Date(now().getTime()+3*864e5)));
    if(!due){ return; }
    m.tag=tag;
    const key='commit:'+m.id;
    if(!state.queue.some(e=>e.key===key)){
      state.queue.push({id:uid('sq'),key,seq:'commitment',customerId:m.customerId,relatedId:m.id,
        body:desc.trim(),subject:'Commitment',kind:'commitment',status:'pending',createdAt:state.simNow,
        outcome:null,reason:'',dueAt:new Date(due+'T17:00:00').toISOString()});
    }
    emit('CommitmentMade',desc.trim()+' — due '+dayLabel(due),m.id);
  } else { m.tag=tag; }
  save(); render();
}
function completeCommitment(id){ const e=state.queue.find(e=>e.id===id); if(!e) return; e.status='done'; e.outcome='completed'; save(); render(); }
function overdueCommitments(){ return state.queue.filter(e=>e.seq==='commitment'&&e.status==='pending'&&e.dueAt&&new Date(e.dueAt)<now()); }
let needsReplyOnly=true;
function setTo(v){ compose.to=v; activeThread=v||activeThread; const [k,id]=v.split(':'); compose.channel=k==='c'?(cust(id)?.pref||'SMS'):'Internal'; if(k==='c') threadTab='customer'; else threadTab='staff'; render(); }
function draftFor(custId,text){ activeThread='c:'+custId; threadTab='customer'; compose.to='c:'+custId; compose.channel=cust(custId).pref; compose.body=text; compose.subject=cust(custId).pref==='Email'?'Following up':''; render(); document.getElementById('composer')?.scrollIntoView({behavior:'smooth'}); }

/* ============ CALENDAR ============ */

function apptRow(j){

/* ============ LIVE DATA (Supabase) ============ */
let supabase, session, orgId, profile, bizMode='live';

async function initApp(){
  const view = document.getElementById('view');
  view.innerHTML = '<div class="empty">Loading your account…</div>';

  const mod = await import('./supabaseClient.js');
  supabase = mod.supabase;

  const { data: sessData } = await supabase.auth.getSession();
  session = sessData.session;
  if(!session){ window.location.href = './auth.html'; return; }

  const { data: prof, error: profErr } = await supabase
    .from('profiles')
    .select('*, organizations(*)')
    .eq('id', session.user.id)
    .single();

  if(profErr || !prof){
    view.innerHTML = '<div class="empty">Could not load your account. Try logging in again.</div>';
    return;
  }
  profile = prof; orgId = prof.org_id;
  const org = prof.organizations;
  document.getElementById('orgLabel').textContent = org?.name || '';

  if(org){
    state.biz = {
      name: org.name, tz: org.tz, currency: org.currency, vat: org.vat, depositRate: org.deposit_rate,
      workStart: org.work_start, workEnd: org.work_end, quietStart: org.quiet_start, quietEnd: org.quiet_end,
      buffer: org.buffer, speed: org.speed, closedDays: org.closed_days||[0]
    };
    state.settings = org.settings || state.settings;
    bizMode = state.settings.mode === 'demo' ? 'demo' : 'live';
  }

  if(bizMode==='live'){
    // Real deployed mode: the clock is just... the actual clock. No manual advancing.
    state.simNow = new Date().toISOString();
    setInterval(()=>{ state.simNow = new Date().toISOString(); scan(); render(); }, 60000);
    document.getElementById('advanceControls').style.display='none';
    document.getElementById('clockModeLabel').textContent='current time';
  }

  await loadLiveData();
  refreshGmailStatus();
  const qp = new URLSearchParams(window.location.search);
  if(qp.get('gmail')==='connected'){ toast('Gmail connected.'); history.replaceState({},'',window.location.pathname); }
  else if(qp.get('gmail')==='error'){ toast('Gmail connection failed — try again.'); history.replaceState({},'',window.location.pathname); }
  scan(); render();
}

async function loadLiveData(){
  const [custs, jobs, leads, quotes, messages, queue, team, invites, events] = await Promise.all([
    supabase.from('customers').select('*'),
    supabase.from('jobs').select('*'),
    supabase.from('leads').select('*'),
    supabase.from('quotes').select('*'),
    supabase.from('messages').select('*').eq('thread','customer'),
    supabase.from('message_queue').select('*'),
    supabase.from('profiles').select('id,name,role'),
    supabase.from('invites').select('*').is('accepted_at', null).order('created_at', {ascending:false}),
    supabase.from('events').select('*').order('at', {ascending:false}).limit(150)
  ]);

  if(custs.data) state.customers = custs.data.map(c=>({
    id:c.id, name:c.name, phone:c.phone||'', email:c.email||'', pref:c.pref||'SMS',
    consent:c.consent||{sms:'unknown',whatsapp:'unknown',email:'unknown'},
    lastInbound:c.last_inbound||{}, avgInterval:c.avg_interval, avgValue:c.avg_value,
    lastRebookAt:c.last_rebook_at
  }));

  if(jobs.data) state.jobs = jobs.data.map(j=>({
    // NOTE: tech_id isn't loaded from the cloud yet — technician assignment
    // isn't wired to real staff accounts. See the note in syncToCloud().
    id:j.id, customerId:j.customer_id, techId:j.tech_id, date:j.date, startMin:j.start_min,
    durMin:j.dur_min, type:j.type, dist:j.dist, driveMin:j.drive_min, status:j.status,
    remindersSent:j.reminders_sent||[], completedAt:j.completed_at, quoteId:j.quote_id
  }));

  if(leads.data) state.leads = leads.data.map(l=>({
    id:l.id, customerId:l.customer_id, source:l.source, stage:l.stage, note:l.note||'',
    urgent:!!l.urgent, type:l.type||'repair', createdAt:l.created_at, lastTouch:l.last_touch,
    offer:l.offer, quoteRequested:!!l.quote_requested, nurtured:l.nurtured||[], lossReason:l.loss_reason||null
  }));

  if(quotes.data) state.quotes = quotes.data.map(q=>({
    id:q.id, customerId:q.customer_id, leadId:q.lead_id, type:q.type, items:q.items||[],
    version:q.version, status:q.status, createdAt:q.created_at, sentAt:q.sent_at,
    followUps:q.follow_ups||[], isRange:!!q.is_range
  }));

  // Keep any local staff-thread messages (internal notes) — those aren't synced yet —
  // and replace customer-thread messages with the real synced ones.
  const staffMsgs = state.messages.filter(m=>m.thread==='staff');
  const custMsgs = (messages.data||[]).map(m=>({
    id:m.id, thread:'customer', customerId:m.customer_id, dir:m.dir, channel:m.channel,
    subject:m.subject||'', body:m.body, at:m.at, status:m.status, reason:m.reason||'',
    template:!!m.template, sendAt:m.send_at, kind:m.kind, tag:m.tag||'', read:!!m.read
  }));
  state.messages = [...staffMsgs, ...custMsgs];

  if(queue.data) state.queue = queue.data.map(e=>({
    id:e.id, key:e.key, seq:e.seq, customerId:e.customer_id, relatedId:e.related_id,
    body:e.body, subject:e.subject||'', kind:e.kind, status:e.status, createdAt:e.created_at,
    outcome:e.outcome, reason:e.reason||'', dueAt:e.due_at||null
  }));

  // Real team members replace the old fake demo users entirely — booking,
  // technician assignment and staff messages all use this list from here on.
  if(team.data) state.users = team.data.map(p=>({id:p.id, name:p.name, role:p.role}));
  pendingInvites = invites.data || [];

  if(events.data) state.events = events.data.map(e=>({id:e.id, at:e.at, type:e.type, text:e.text, ref:e.ref}));

  // Remember what's already in the cloud, so future saves know what got
  // removed locally (discarded queue entries, etc.) and delete it remotely too.
  lastSynced = {
    customers: new Set(state.customers.map(c=>c.id)),
    jobs: new Set(state.jobs.map(j=>j.id)),
    leads: new Set(state.leads.map(l=>l.id)),
    quotes: new Set(state.quotes.map(q=>q.id)),
    messages: new Set(custMsgs.map(m=>m.id)),
    queue: new Set(state.queue.map(e=>e.id)),
    events: new Set(state.events.map(e=>e.id))
  };
}

/* ---- push local changes up to Supabase, and delete anything removed locally ---- */
let lastSynced = {customers:new Set(),jobs:new Set(),leads:new Set(),quotes:new Set(),messages:new Set(),queue:new Set(),events:new Set()};
let syncing = false, syncQueued = false;
let pendingInvites = [];

async function sendInvite(email, role){
  email = (email||'').trim().toLowerCase();
  if(!email){ toast('Enter an email address.'); return; }
  if(!['office','technician'].includes(role)){ toast('Pick a role.'); return; }
  const { data, error } = await supabase.from('invites').insert({ org_id: orgId, email, role }).select().single();
  if(error){ toast('Could not create invite: '+error.message); return; }
  pendingInvites = [data, ...pendingInvites];
  render();
  const link = window.location.origin + '/auth.html?invite=' + data.token;
  navigator.clipboard?.writeText(link).catch(()=>{});
  toast('Invite link copied to clipboard — send it to '+email+'.');
}
async function revokeInvite(id){
  const { error } = await supabase.from('invites').delete().eq('id', id);
  if(error){ toast('Could not revoke invite.'); return; }
  pendingInvites = pendingInvites.filter(i=>i.id!==id);
  render();
}
function copyInviteLink(token){
  const link = window.location.origin + '/auth.html?invite=' + token;
  navigator.clipboard?.writeText(link).catch(()=>{});
  toast('Invite link copied.');
}

async function syncTable(table, rows, mapFn, key){
  const validRows = rows.filter(r=>isUUID(r.id));
  const currentIds = new Set(validRows.map(r=>r.id));
  const toDelete = [...lastSynced[key]].filter(id=>!currentIds.has(id));
  if(validRows.length){
    const { error } = await supabase.from(table).upsert(validRows.map(mapFn));
    if(error) console.error('Sync failed for '+table, error);
  }
  if(toDelete.length){
    const { error } = await supabase.from(table).delete().in('id', toDelete);
    if(error) console.error('Cloud delete failed for '+table, error);
  }
  lastSynced[key] = currentIds;
}

async function syncToCloud(){
  if(!supabase || !orgId) return;
  if(syncing){ syncQueued = true; return; }
  syncing = true;
  try{
    // Sequential, in dependency order (customers -> leads -> quotes -> jobs -> messages -> queue),
    // since quotes reference leads and jobs reference quotes via foreign keys.
    await syncTable('customers', state.customers, c=>({
      id:c.id, org_id:orgId, name:c.name, phone:c.phone||'', email:c.email||'', pref:c.pref||'SMS',
      consent:c.consent, last_inbound:c.lastInbound||{}, avg_interval:c.avgInterval,
      avg_value:c.avgValue, last_rebook_at:c.lastRebookAt||null
    }), 'customers');

    await syncTable('leads', state.leads.filter(l=>isUUID(l.customerId)), l=>({
      id:l.id, org_id:orgId, customer_id:l.customerId, source:l.source||'', stage:l.stage,
      note:l.note||'', urgent:!!l.urgent, type:l.type||'repair', created_at:l.createdAt,
      last_touch:l.lastTouch||null, offer:l.offer||null, quote_requested:!!l.quoteRequested,
      loss_reason:l.lossReason||null,
      nurtured:l.nurtured||[]
    }), 'leads');

    await syncTable('quotes', state.quotes.filter(q=>isUUID(q.customerId)), q=>({
      id:q.id, org_id:orgId, customer_id:q.customerId, lead_id:isUUID(q.leadId)?q.leadId:null,
      type:q.type, items:q.items||[], version:q.version||1, status:q.status,
      created_at:q.createdAt, sent_at:q.sentAt||null, follow_ups:q.followUps||[], is_range:!!q.isRange
    }), 'quotes');

    await syncTable('jobs', state.jobs.filter(j=>isUUID(j.customerId)), j=>({
      id:j.id, org_id:orgId, customer_id:j.customerId, tech_id:isUUID(j.techId)?j.techId:null,
      date:j.date, start_min:j.startMin, dur_min:j.durMin, type:j.type, dist:j.dist,
      drive_min:j.driveMin, status:j.status, reminders_sent:j.remindersSent||[],
      completed_at:j.completedAt||null, quote_id:isUUID(j.quoteId)?j.quoteId:null
    }), 'jobs');

    await syncTable('messages', state.messages.filter(m=>m.thread==='customer' && isUUID(m.customerId)), m=>({
      id:m.id, org_id:orgId, thread:'customer', customer_id:m.customerId, dir:m.dir,
      channel:m.channel, subject:m.subject||'', body:m.body, at:m.at, status:m.status,
      reason:m.reason||'', template:!!m.template, send_at:m.sendAt||null, kind:m.kind||null,
      tag:m.tag||'', read:!!m.read
    }), 'messages');

    await syncTable('message_queue', state.queue.filter(e=>isUUID(e.customerId)), e=>({
      id:e.id, org_id:orgId, key:e.key, seq:e.seq, customer_id:e.customerId,
      related_id:e.relatedId||null, body:e.body, subject:e.subject||'', kind:e.kind||null,
      status:e.status, created_at:e.createdAt, outcome:e.outcome||null, reason:e.reason||'', due_at:e.dueAt||null
    }), 'queue');

    // Events are insert-only: the local array is capped at 150 for display,
    // so diffing it like the other tables would delete older cloud history
    // every time the cap rolls old ones out of memory. Just add new ones.
    const newEvents = state.events.filter(e=>isUUID(e.id) && !lastSynced.events.has(e.id));
    if(newEvents.length){
      const { error } = await supabase.from('events').insert(newEvents.map(e=>({
        id:e.id, org_id:orgId, at:e.at, type:e.type, text:e.text, ref:isUUID(e.ref)?e.ref:null
      })));
      if(error) console.error('Sync failed for events', error);
      else newEvents.forEach(e=>lastSynced.events.add(e.id));
    }
    setSaveNote('Saved');
  } catch(err){
    console.error('Cloud sync error', err);
    setSaveNote('Sync error — check connection');
  } finally {
    syncing = false;
    if(syncQueued){ syncQueued = false; syncToCloud(); }
  }
}

async function logout(){
  await supabase.auth.signOut();
  window.location.href = './auth.html';
}

initApp();
